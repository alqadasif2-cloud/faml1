name: Android Production CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Clean Gradle Workspace
        run: ./gradlew clean --no-daemon

      - name: Build Debug APKs (:parent & :kids)
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build Release APKs (:parent & :kids)
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: FamilyGuard-Debug-APKs
          path: |
            android/parent/build/outputs/apk/debug/*.apk
            android/kids/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: FamilyGuard-Release-APKs
          path: |
            android/parent/build/outputs/apk/release/*.apk
            android/kids/build/outputs/apk/release/*.apk
          retention-days: 30
